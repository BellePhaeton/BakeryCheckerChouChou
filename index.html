<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Сборка заказа</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --text:#111827; --dim:#6b7280; --soft:#9ca3af;
  --border:#e5e7eb; --border-soft:#f3f4f6;
  --primary:#2563eb; --primary-soft:#eff6ff;
  --success:#16a34a; --success-soft:#f0fdf4;
  --warn:#f59e0b; --danger:#dc2626;
  --radius:14px;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:inherit}
#app{max-width:820px;margin:0 auto;padding:16px 14px 80px}

/* ---------- Upload ---------- */
.upload-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center;padding:20px 0}
.upload-hero{margin-bottom:24px}
.upload-hero .logo{font-size:56px;line-height:1;margin-bottom:12px}
.upload-hero h1{margin:0 0 8px;font-size:26px;font-weight:700}
.upload-hero p{margin:0;color:var(--dim);max-width:420px}
.dropzone{
  width:100%;max-width:480px;padding:32px 20px;border:2px dashed var(--border);
  border-radius:var(--radius);background:var(--card);transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.dropzone.over{border-color:var(--primary);background:var(--primary-soft)}
.dz-icon{font-size:36px;opacity:.8}
.dz-title{font-weight:600}
.dz-sub{color:var(--soft);font-size:13px}
.btn{padding:11px 22px;border-radius:10px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.hint{margin-top:16px;color:var(--soft);font-size:13px}
.error{margin-top:16px;padding:12px 16px;background:#fef2f2;border:1px solid #fecaca;color:var(--danger);border-radius:10px;max-width:480px;text-align:left;font-size:14px}

/* ---------- Header ---------- */
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.header h1{margin:0;font-size:20px;font-weight:700}
.subtitle{color:var(--dim);font-size:13px;margin-top:2px}
.header-right{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--dim)}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:#c7d9fb}

/* ---------- Overall card ---------- */
.overall-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.overall-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.overall-label{font-size:13px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.overall-pct{font-size:22px;font-weight:700;color:var(--primary)}
.overall-meta{margin-top:8px;font-size:13px;color:var(--dim)}
.bar{height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden;position:relative}
.bar.big{height:10px}
.bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:99px;
  transition:width .3s ease;width:0}
.point-card.done .bar-fill,.bar-fill.full{background:linear-gradient(90deg,#22c55e,#16a34a)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--card);border-radius:var(--radius);padding:4px;
  box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--dim);transition:.15s;min-height:40px}
.tab.active{background:var(--primary);color:#fff}
.tab:not(.active):hover{background:var(--border-soft)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);
  border-radius:10px;box-shadow:var(--shadow);font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--primary);margin:0}
#search{flex:1;min-width:160px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);outline:none;transition:.15s;min-height:42px}
#search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------- Point cards ---------- */
.point-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:10px;overflow:hidden;transition:.2s;border:1px solid transparent}
.point-card.done{border-color:#bbf7d0}
.point-head{padding:14px 16px;cursor:pointer;user-select:none;transition:.15s}
.point-head:active{background:var(--border-soft)}
.point-title{font-weight:600;font-size:15px;margin-bottom:8px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.point-progress{display:flex;align-items:center;gap:10px}
.point-progress .bar{flex:1}
.pct{font-size:13px;font-weight:600;color:var(--primary);min-width:38px;text-align:right}
.point-card.done .pct{color:var(--success)}
.point-meta{margin-top:6px;font-size:12.5px;color:var(--dim)}
.point-card.done .point-meta{color:var(--success)}
.point-body{border-top:1px solid var(--border-soft)}
.item{padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;
  flex-direction:column;gap:8px;transition:.15s}
.item:last-child{border-bottom:none}
.item.done{background:var(--success-soft)}
.item-name{font-size:14.5px;line-height:1.35}
.item.done .item-name{color:var(--success);text-decoration:line-through;text-decoration-thickness:1px}
.item-controls{display:flex;align-items:center;gap:8px}
.ctrl{width:38px;height:38px;border-radius:9px;background:var(--border-soft);font-size:20px;
  font-weight:600;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text)}
.ctrl:hover:not(:disabled){background:#dbeafe;color:var(--primary)}
.ctrl:disabled{opacity:.35;cursor:not-allowed}
.cnt{width:56px;height:38px;border-radius:9px;border:1px solid var(--border);text-align:center;
  font-weight:700;font-size:16px;outline:none;background:#fff;padding:0 4px}
.cnt:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.item.done .cnt{border-color:#86efac;background:#fff}
.of{color:var(--dim);font-weight:600;font-size:14px;min-width:44px}
.check{width:38px;height:38px;border-radius:9px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  color:#fff;transition:.15s;margin-left:auto;background:#fff}
.check:hover{border-color:var(--primary)}
.check.checked{background:var(--success);border-color:var(--success)}
.empty-row{padding:18px 16px;color:var(--soft);text-align:center;font-size:14px}

/* ---------- Summary table ---------- */
.summary-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
.summary{border-collapse:collapse;font-size:13px;width:100%}
.summary th,.summary td{padding:9px 10px;border-bottom:1px solid var(--border-soft);text-align:center;white-space:nowrap}
.summary thead th{background:#f9fafb;font-weight:600;color:var(--dim);position:sticky;top:0;z-index:2;
  font-size:12px;text-transform:uppercase;letter-spacing:.02em}
.summary .sticky-col{position:sticky;left:0;background:#fff;text-align:left;font-weight:500;
  max-width:220px;white-space:normal;z-index:1;box-shadow:1px 0 0 var(--border-soft)}
.summary thead .sticky-col{background:#f9fafb;z-index:3}
.summary td.cell{font-weight:600;color:var(--dim)}
.summary td.cell.partial{color:var(--primary);background:var(--primary-soft)}
.summary td.cell.done{color:var(--success);background:var(--success-soft)}
.summary td.empty{color:#d1d5db;font-weight:400}
.summary td.total-col{font-weight:700;background:#f9fafb;color:var(--text)}
.summary td.total-col.done{color:var(--success);background:var(--success-soft)}
.summary td.total-col.partial{color:var(--primary);background:var(--primary-soft)}
.summary tbody tr:hover td{filter:brightness(0.98)}

/* ---------- Celebration ---------- */
.celebrate{position:fixed;bottom:16px;left:16px;right:16px;max-width:780px;margin:0 auto;
  background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:14px 20px;
  border-radius:var(--radius);box-shadow:0 8px 24px rgba(22,163,74,.35);
  display:flex;align-items:center;gap:12px;font-weight:600;animation:slideUp .4s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.celebrate .big{font-size:24px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ========== Утилиты ========== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ========== Состояние ========== */
const STORAGE_KEY='orderTracker.v1';
const state={order:null,picked:{},view:'points',filterUnsorted:true,search:'',collapsed:{},error:null};

const keyOf=(pi,xi)=>pi+':'+xi;
const getPicked=(pi,xi)=>state.picked[keyOf(pi,xi)]||0;

/* ========== Сохранение ========== */
function serialize(o){return{points:o.points,products:o.products,
  orderDate:o.orderDate?o.orderDate.toISOString():null,sheetName:o.sheetName,filename:o.filename};}
function deserialize(o){return{...o,orderDate:o.orderDate?new Date(o.orderDate):null};}
function saveState(){
  if(!state.order)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({
    order:serialize(state.order),picked:state.picked,savedAt:Date.now()}));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||!d.order)return false;
    state.order=deserialize(d.order); state.picked=d.picked||{}; return true;
  }catch(e){return false;}
}

/* ========== Парсер XLSX ========== */
function parseDate(v){
  if(v==null)return null;
  if(v instanceof Date)return v;
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return new Date(d.y,d.m-1,d.d);}
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
  if(m){let y=parseInt(m[3]);if(y<100)y+=2000;return new Date(y,parseInt(m[2])-1,parseInt(m[1]));}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  return null;
}

function parseOrder(buf,filename){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  let sheetName=wb.SheetNames.find(n=>n==='TDSheet')||wb.SheetNames[0];
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error('В файле не найден лист с данными.');
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,blankrows:false});

  /* Ищем шапку — строку, где есть столбец "Номенклатура" */
  let headerIdx=-1, productCol=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      if(row[c]&&String(row[c]).trim().toLowerCase()==='номенклатура'){headerIdx=r;productCol=c;break;}
    }
    if(headerIdx>=0)break;
  }
  if(headerIdx<0)throw new Error('Не найден столбец «Номенклатура». Проверьте формат файла.');

  const headerRow=rows[headerIdx]||[];
  const dateCol=productCol>0?productCol-1:0;

  /* Точки — колонки после "Номенклатура", кроме "Итого" */
  const rawPoints=[];
  for(let c=productCol+1;c<headerRow.length;c++){
    const v=headerRow[c];
    if(v==null||String(v).trim()==='')continue;
    const name=String(v).trim();
    if(/^итого$/i.test(name))continue;
    rawPoints.push({name,col:c});
  }
  if(rawPoints.length===0)throw new Error('Не найдено ни одной точки доставки в шапке файла.');

  /* Данные */
  const rawProducts=[];
  let orderDate=null;
  for(let r=headerIdx+1;r<rows.length;r++){
    const row=rows[r]||[];
    const first=row[dateCol];
    const pname=row[productCol];
    if(first&&/^итого$/i.test(String(first).trim()))break;
    if(pname==null||String(pname).trim()==='')continue;
    if(!orderDate)orderDate=parseDate(first);

    const perPoint={};let total=0;
    for(let i=0;i<rawPoints.length;i++){
      const v=Number(row[rawPoints[i].col]);
      if(Number.isFinite(v)&&v>0){perPoint[i]=v;total+=v;}
    }
    if(total===0)continue;
    rawProducts.push({name:String(pname).trim(),perPoint});
  }
  if(rawProducts.length===0)throw new Error('В файле не найдено ни одной позиции с количеством.');

  /* Выкидываем точки, куда ничего не едет */
  const keepIdx=rawPoints.map((_,i)=>i).filter(i=>rawProducts.some(p=>p.perPoint[i]));
  const points=keepIdx.map(i=>rawPoints[i]);
  const remap={};keepIdx.forEach((oldI,newI)=>remap[oldI]=newI);
  const products=rawProducts.map(p=>{
    const np={};
    for(const[k,v]of Object.entries(p.perPoint)){
      const ni=remap[+k];if(ni!=null)np[ni]=v;
    }
    return{name:p.name,perPoint:np};
  });

  return{points,products,orderDate,sheetName,filename:filename||'order.xlsx'};
}

/* ========== Подсчёты ========== */
function pointStats(pi){
  const{products}=state.order;
  let lt=0,ld=0,ut=0,ud=0;
  for(let xi=0;xi<products.length;xi++){
    const ord=products[xi].perPoint[pi]||0;
    if(ord===0)continue;
    const got=Math.min(getPicked(pi,xi),ord);
    lt++;ut+=ord;ud+=got;
    if(got>=ord)ld++;
  }
  return{linesTotal:lt,linesDone:ld,unitsTotal:ut,unitsDone:ud};
}
function overallStats(){
  const{points}=state.order;
  let lt=0,ld=0,ut=0,ud=0;
  for(let pi=0;pi<points.length;pi++){
    const s=pointStats(pi);
    lt+=s.linesTotal;ld+=s.linesDone;ut+=s.unitsTotal;ud+=s.unitsDone;
  }
  return{linesTotal:lt,linesDone:ld,unitsTotal:ut,unitsDone:ud};
}
const pct=(d,t)=>t===0?0:Math.round(d*100/t);
function shortName(name){const m=name.match(/\(([^)]+)\)\s*$/);return m?m[1]:name;}

/* ========== Действия ========== */
function setPicked(pi,xi,val){
  const ord=state.order.products[xi].perPoint[pi]||0;
  val=Math.max(0,Math.min(ord,val|0));
  const k=keyOf(pi,xi);
  if(val===0)delete state.picked[k];else state.picked[k]=val;
  saveState();
}
function toggleDone(pi,xi){
  const ord=state.order.products[xi].perPoint[pi]||0;
  const cur=getPicked(pi,xi);
  setPicked(pi,xi,cur>=ord?0:ord);
}

/* ========== Рендер ========== */
function render(){
  const app=$('#app');
  if(!state.order){app.innerHTML=renderUpload();bindUpload();}
  else{app.innerHTML=renderApp();}
}

function renderUpload(){
  return `
  <div class="upload-screen">
    <div class="upload-hero">
      <div class="logo">📦</div>
      <h1>Сборка заказа</h1>
      <p>Загрузите XLSX с заказом — приложение разобьёт его по точкам и позициям и поможет отследить сборку.</p>
    </div>
    <div class="dropzone" id="dropzone">
      <div class="dz-icon">📄</div>
      <div class="dz-title">Перетащите файл сюда</div>
      <div class="dz-sub">или</div>
      <button class="btn primary" id="pick-file">Выбрать файл</button>
      <input type="file" id="file-input" accept=".xlsx,.xls,.xlsm" hidden>
    </div>
    <div class="hint">Поддерживаются форматы .xlsx, .xls, .xlsm</div>
    ${state.error?`<div class="error">${esc(state.error)}</div>`:''}
  </div>`;
}

function renderApp(){
  const{order}=state;
  const ov=overallStats();
  const dateStr=order.orderDate
    ?order.orderDate.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})
    :'';
  const allDone=ov.unitsTotal>0&&ov.unitsDone===ov.unitsTotal;

  return `
  <div class="header">
    <div>
      <h1>Сборка заказа</h1>
      <div class="subtitle">${esc(dateStr)}${dateStr?' · ':''}${order.products.length} позиций · ${order.points.length} точек</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="reset-all" title="Сбросить прогресс">↺</button>
      <button class="icon-btn" id="change-file" title="Загрузить другой файл">⇅</button>
    </div>
  </div>

  <div class="overall-card">
    <div class="overall-row">
      <div class="overall-label">Общий прогресс</div>
      <div class="overall-pct">${pct(ov.unitsDone,ov.unitsTotal)}%</div>
    </div>
    <div class="bar big"><div class="bar-fill ${allDone?'full':''}" style="width:${pct(ov.unitsDone,ov.unitsTotal)}%"></div></div>
    <div class="overall-meta">${ov.linesDone}/${ov.linesTotal} позиций · ${ov.unitsDone}/${ov.unitsTotal} шт</div>
  </div>

  <div class="tabs">
    <button class="tab ${state.view==='points'?'active':''}" data-view="points">По точкам</button>
    <button class="tab ${state.view==='summary'?'active':''}" data-view="summary">Сводка</button>
  </div>

  <div class="filters">
    <label class="chk"><input type="checkbox" id="filter-unsorted" ${state.filterUnsorted?'checked':''}><span>Только несобранное</span></label>
    <input type="search" id="search" placeholder="Поиск по названию…" value="${esc(state.search)}">
  </div>

  <div class="content" id="content">
    ${state.view==='points'?renderPoints():renderSummary()}
  </div>

  ${allDone?`<div class="celebrate"><span class="big">✅</span><span>Заказ собран полностью — можно отправлять!</span></div>`:''}
  `;
}

function renderPoints(){
  const{points,products}=state.order;
  const q=state.search.trim().toLowerCase();
  let html='';
  let visiblePoints=0;

  for(let pi=0;pi<points.length;pi++){
    const items=[];
    for(let xi=0;xi<products.length;xi++){
      const ord=products[xi].perPoint[pi]||0;
      if(ord===0)continue;
      const got=getPicked(pi,xi);
      if(state.filterUnsorted&&got>=ord)continue;
      if(q&&!products[xi].name.toLowerCase().includes(q))continue;
      items.push({xi,ordered:ord,got,name:products[xi].name});
    }

    const st=pointStats(pi);
    if(st.linesTotal===0)continue;

    /* Если фильтр включён и всё собрано — скрываем точку целиком */
    if(state.filterUnsorted&&st.linesDone>=st.linesTotal)continue;
    /* Если поиск не нашёл в этой точке ничего — скрываем */
    if(q&&items.length===0)continue;

    visiblePoints++;
    const isDone=st.linesDone===st.linesTotal&&st.linesTotal>0;
    const name=points[pi].name;
    const collapsed=state.collapsed[name];
    const p=pct(st.unitsDone,st.unitsTotal);

    html+=`<div class="point-card ${isDone?'done':''}" data-point="${pi}">
      <div class="point-head" data-toggle="${pi}">
        <div class="point-title">${esc(name)}</div>
        <div class="point-progress">
          <div class="bar"><div class="bar-fill" style="width:${p}%"></div></div>
          <span class="pct">${p}%</span>
        </div>
        <div class="point-meta">${st.linesDone}/${st.linesTotal} позиций · ${st.unitsDone}/${st.unitsTotal} шт ${isDone?'✓':''}</div>
      </div>`;

    if(!collapsed){
      html+=`<div class="point-body">`;
      if(items.length===0){
        html+=`<div class="empty-row">${st.linesTotal===0?'Нет позиций':'Всё собрано'}</div>`;
      }else{
        for(const it of items)html+=renderItem(pi,it);
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  }

  if(visiblePoints===0)html=`<div class="empty-row" style="background:#fff;border-radius:14px;padding:32px">
    ${state.filterUnsorted?'Все позиции собраны 🎉':'Ничего не найдено'}</div>`;
  return html;
}

function renderItem(pi,it){
  const done=it.got>=it.ordered;
  return `<div class="item ${done?'done':''}" data-pi="${pi}" data-xi="${it.xi}">
    <div class="item-name">${esc(it.name)}</div>
    <div class="item-controls">
      <button class="ctrl" data-act="dec" ${it.got<=0?'disabled':''}>−</button>
      <input type="number" class="cnt" value="${it.got}" min="0" max="${it.ordered}" inputmode="numeric">
      <span class="of">/ ${it.ordered}</span>
      <button class="ctrl" data-act="inc" ${done?'disabled':''}>+</button>
      <button class="check ${done?'checked':''}" data-act="toggle" title="${done?'Снять отметку':'Отметить собранным'}">${done?'✓':''}</button>
    </div>
  </div>`;
}

function renderSummary(){
  const{points,products}=state.order;
  const q=state.search.trim().toLowerCase();
  let html=`<div class="summary-wrap"><table class="summary"><thead><tr>
    <th class="sticky-col">Товар</th>`;
  for(const p of points)html+=`<th title="${esc(p.name)}">${esc(shortName(p.name))}</th>`;
  html+=`<th class="total-col">Итого</th></tr></thead><tbody>`;

  let rows=0;
  for(let xi=0;xi<products.length;xi++){
    const prod=products[xi];
    if(q&&!prod.name.toLowerCase().includes(q))continue;

    /* Фильтр: пропускаем строки, где всё собрано */
    if(state.filterUnsorted){
      let allDone=true,hasAny=false;
      for(let pi=0;pi<points.length;pi++){
        const ord=prod.perPoint[pi]||0;
        if(ord===0)continue;
        hasAny=true;
        if(getPicked(pi,xi)<ord){allDone=false;break;}
      }
      if(hasAny&&allDone)continue;
    }

    rows++;
    html+=`<tr><td class="sticky-col">${esc(prod.name)}</td>`;
    let tOrd=0,tGot=0;
    for(let pi=0;pi<points.length;pi++){
      const ord=prod.perPoint[pi]||0;
      if(ord===0){html+=`<td class="cell empty">—</td>`;continue;}
      const got=Math.min(getPicked(pi,xi),ord);
      tOrd+=ord;tGot+=got;
      const cls=got>=ord?'cell done':got>0?'cell partial':'cell';
      html+=`<td class="${cls}">${got}/${ord}</td>`;
    }
    const tCls=tGot>=tOrd?'total-col done':tGot>0?'total-col partial':'total-col';
    html+=`<td class="${tCls}">${tGot}/${tOrd}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  if(rows===0)html=`<div class="empty-row" style="background:#fff;border-radius:14px;padding:32px">
    ${state.filterUnsorted?'Все позиции собраны 🎉':'Ничего не найдено'}</div>`;
  return html;
}

/* ========== Перерисовка только контента ========== */
function renderContent(){
  const c=$('#content');
  if(!c)return;
  c.innerHTML=state.view==='points'?renderPoints():renderSummary();
}
function refreshChrome(){
  /* Пересчёт верхней карточки и табов, если что-то поменялось */
  if(!state.order)return;
  const ov=overallStats();
  const pc=$('.overall-pct'),bar=$('.overall-card .bar-fill'),meta=$('.overall-meta');
  if(pc)pc.textContent=pct(ov.unitsDone,ov.unitsTotal)+'%';
  if(bar){bar.style.width=pct(ov.unitsDone,ov.unitsTotal)+'%';
    bar.classList.toggle('full',ov.unitsTotal>0&&ov.unitsDone===ov.unitsTotal);}
  if(meta)meta.textContent=`${ov.linesDone}/${ov.linesTotal} позиций · ${ov.unitsDone}/${ov.unitsTotal} шт`;
}

/* ========== Загрузка файла ========== */
function bindUpload(){
  const dz=$('#dropzone'),fi=$('#file-input'),btn=$('#pick-file');
  if(!dz)return;

  btn.addEventListener('click',()=>{fi.value='';fi.click();});
  fi.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>{
    const f=e.dataTransfer.files[0];
    if(f)handleFile(f);
  });
}

async function handleFile(file){
  state.error=null;
  try{
    const buf=await file.arrayBuffer();
    const order=parseOrder(buf,file.name);
    /* Если в сохранёнке был тот же заказ — не спрашиваем */
    const hadProgress=Object.keys(state.picked).length>0;
    if(hadProgress){
      const sameOrder=state.order
        &&state.order.products.length===order.products.length
        &&state.order.points.length===order.points.length;
      if(!sameOrder&&!confirm('У вас есть сохранённый прогресс по другому заказу. Начать заново?')){
        return;
      }
      if(!sameOrder)state.picked={};
    }
    state.order=order;
    state.collapsed={};
    state.search='';
    saveState();
    render();
  }catch(err){
    state.error='Не удалось разобрать файл: '+(err.message||err);
    render();
  }
}

/* ========== События ========== */
document.addEventListener('click',e=>{
  const t=e.target;

  /* Таб */
  const tab=t.closest('.tab');
  if(tab){
    state.view=tab.dataset.view;
    $$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));
    renderContent();
    return;
  }

  /* Свернуть/развернуть точку */
  const ph=t.closest('[data-toggle]');
  if(ph){
    const pi=+ph.dataset.toggle;
    const name=state.order.points[pi].name;
    state.collapsed[name]=!state.collapsed[name];
    renderContent();
    return;
  }

  /* Кнопки +/−/чек */
  const btn=t.closest('[data-act]');
  if(btn){
    const item=btn.closest('.item');
    if(!item)return;
    const pi=+item.dataset.pi,xi=+item.dataset.xi;
    const cur=getPicked(pi,xi);
    const act=btn.dataset.act;
    if(act==='inc')setPicked(pi,xi,cur+1);
    else if(act==='dec')setPicked(pi,xi,cur-1);
    else if(act==='toggle')toggleDone(pi,xi);
    renderContent();refreshChrome();
    return;
  }

  /* Сменить файл */
  if(t.closest('#change-file')){
    if(Object.keys(state.picked).length>0&&!confirm('Открыть другой файл? Текущий прогресс будет заменён.'))return;
    state.order=null;state.picked={};state.error=null;
    saveState();
    render();
    return;
  }

  /* Сбросить весь прогресс */
  if(t.closest('#reset-all')){
    if(confirm('Сбросить весь прогресс по этому заказу?')){
      state.picked={};saveState();render();
    }
    return;
  }
});

/* Живой ввод в счётчик */
document.addEventListener('input',e=>{
  const t=e.target;

  /* Поиск — перерисовываем только контент, фокус сохранится */
  if(t.id==='search'){
    state.search=t.value;
    renderContent();
    return;
  }

  /* Счётчик */
  if(t.classList.contains('cnt')){
    const item=t.closest('.item');
    const pi=+item.dataset.pi,xi=+item.dataset.xi;
    let v=parseInt(t.value,10);if(isNaN(v))v=0;
    setPicked(pi,xi,v);
    /* Лёгкое обновление внешнего вида строки без полной перерисовки */
    const ord=state.order.products[xi].perPoint[pi]||0;
    const got=getPicked(pi,xi);
    const done=got>=ord;
    item.classList.toggle('done',done);
    const chk=item.querySelector('.check');
    if(chk){chk.classList.toggle('checked',done);chk.textContent=done?'✓':'';}
    refreshChrome();
  }
});

/* Смена чекбокса фильтра */
document.addEventListener('change',e=>{
  if(e.target.id==='filter-unsorted'){
    state.filterUnsorted=e.target.checked;
    renderContent();
  }
  /* После блюра счётчика — полная перерисовка (обновить прогресс-бары) */
  if(e.target.classList&&e.target.classList.contains('cnt')){
    renderContent();refreshChrome();
  }
});

/* ========== Старт ========== */
if(loadState())render();
else render();

})();
</script>
</body>
</html>
